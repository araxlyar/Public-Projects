<!DOCTYPE html>
<html lang="en">
<head>
    <title>Blood Donation Form</title>
    <style>
        body {
            font-family: 'Times New Roman';
            background-color: #640404;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            background: #530000;
            margin: 20px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-top: 5px solid #fffffffd;
        }
        h2 {
            text-align: center;
            color: #fffbfb;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
        }
        input[type="text"],
        input[type="phone number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input {
            margin: 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #000000;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0b881c;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Blood Donation Form</h2>
    <form action="/submit-donation" method="POST">

        <div class="form-group">
            <input type="text" id="name" name="name" required placeholder="full name">
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required placeholder="email.com">
        </div>
        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required placeholder="phone number">
        </div>
        <div class="form-group">
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
        </div>
        <div class="form-group">
            <label>Gender:</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="male" required> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
                <label><input type="radio" name="gender" value="other"> Other</label>
            </div>
        </div>
        <div class="form-group">
            <label for="blood-group">Blood Group:</label>
            <select id="blood-group" name="blood_group" required>
                <option value="" disabled selected>Select your blood type</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="unknown">Don't Know</option>
            </select>
        </div>
        <div class="form-group checkbox-group">
            <input type="checkbox" id="eligibility" name="eligibility" required>
            <label for="eligibility">I confirm that I am in good health and weight.</label>
        </div>
        <button type="submit">Register as Donor</button>
    </form>
</div>

</body>
</html>
